[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-alerts"
version = "0.1.0"
description = "Watches a YouTube channel and emails you when a new video is uploaded."
requires-python = ">=3.9"
dependencies = ["python-dotenv>=1.0.1", "requests>=2.32.0"]

[project.scripts]
youtube-alerts = "youtubealerts.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
azure = ["azure-functions>=1.21.0", "azure-data-tables>=12.5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
